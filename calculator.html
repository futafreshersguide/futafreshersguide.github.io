<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTA Academic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media (max-width: 768px) {
            body, p, span, a, input, select, textarea, button, li { font-size: 15px !important; }
        }
        .calc-panel { display: none; padding: 20px; }
        .calc-panel.active { display: block; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: flex-start;
            z-index: 10000; padding: 20px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: white; border-radius: 20px; max-width: 500px; width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); margin: auto; overflow: hidden;
        }
        .modal-head { background: #003366; color: white; padding: 16px 20px; display: flex; justify-content: space-between; }
        .result-hero { padding: 30px 20px; text-align: center; background: #f8fafc; }
        .result-value { font-size: 3rem; font-weight: 900; color: #003366; margin: 0; }
        
        /* Hide PDF container off-screen */
        #pdf-wrapper { position: fixed; top: -9999px; left: -9999px; width: 800px; }
        #pdf-container { display: none; padding: 40px; background: white; font-family: sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <!-- NAV -->
    <div class="bg-blue-900 text-white p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-bold text-xl"><i class="fas fa-calculator mr-2"></i> FUTA Calculator</div>
        <a href="first-semester.html" class="bg-blue-800 hover:bg-blue-700 px-4 py-2 rounded-full text-sm font-bold">1st Sem Guide</a>
    </div>

    <!-- MAIN CARD -->
    <div class="max-w-3xl mx-auto mt-8 px-4 mb-12">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            
            <div class="p-6 bg-slate-50 border-b border-slate-200">
                <label class="block text-sm font-bold text-blue-900 mb-2">Student Name (Optional)</label>
                <input type="text" id="student-name" class="w-full border p-3 rounded-lg outline-none focus:border-blue-500" placeholder="Enter your name">
            </div>

            <div class="p-6 pb-0 text-center">
                <h3 class="text-xl font-bold mb-4">What do you want to calculate?</h3>
            </div>

            <!-- TABS -->
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button class="flex-1 py-4 font-bold text-blue-900 border-b-4 border-blue-900 bg-white" onclick="switchTab('aggregate', this)">Aggregate</button>
                <button class="flex-1 py-4 font-bold text-slate-500 hover:text-blue-900" onclick="switchTab('gpa', this)">GPA</button>
                <button class="flex-1 py-4 font-bold text-slate-500 hover:text-blue-900" onclick="switchTab('cgpa', this)">CGPA</button>
            </div>

            <!-- AGGREGATE PANEL -->
            <div id="panel-aggregate" class="calc-panel active">
                <div class="space-y-4">
                    <div>
                        <label class="block font-bold mb-1">JAMB Score</label>
                        <input type="number" id="jamb-score" class="w-full border p-3 rounded-lg outline-none focus:border-blue-500" placeholder="e.g. 300">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">O'Level Grades (5 Subjects)</label>
                        <div class="space-y-2" id="olevel-container"></div>
                    </div>
                    <button onclick="calculateAggregate()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg mt-4 shadow-md transition">Calculate Aggregate</button>
                </div>
            </div>

            <!-- GPA PANEL -->
            <div id="panel-gpa" class="calc-panel">
                <div class="space-y-2 mb-4" id="gpa-rows"></div>
                <button onclick="addGPARow()" class="text-blue-600 font-bold mb-6">+ Add Course</button>
                <button onclick="calculateGPA()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg shadow-md transition">Calculate GPA</button>
            </div>

            <!-- CGPA PANEL -->
            <div id="panel-cgpa" class="calc-panel">
                <div class="space-y-2 mb-4" id="cgpa-rows"></div>
                <button onclick="addCGPARow()" class="text-blue-600 font-bold mb-6">+ Add Semester</button>
                <button onclick="calculateCGPA()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg shadow-md transition">Calculate CGPA</button>
            </div>

        </div>
    </div>

    <!-- PDF TEMPLATE -->
    <div id="pdf-wrapper">
        <div id="pdf-container">
            <h1 style="color:#003366; border-bottom: 2px solid #003366; padding-bottom: 10px;">FUTA Academic Report</h1>
            <p style="font-size: 14px; margin: 20px 0;"><strong>Student:</strong> <span id="pdf-student-name"></span></p>
            <div id="pdf-dynamic-content" style="margin-top: 20px;"></div>
            <p style="margin-top: 40px; font-size: 10px; color: #666; text-align: center;">Independent student tool. Not an official FUTA document.</p>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        // --- TABS ---
        function switchTab(tabId, btn) {
            document.querySelectorAll('.calc-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.flex.border-b button').forEach(b => {
                b.classList.remove('border-blue-900', 'bg-white', 'text-blue-900');
                b.classList.add('text-slate-500');
            });
            document.getElementById('panel-' + tabId).classList.add('active');
            btn.classList.remove('text-slate-500');
            btn.classList.add('border-blue-900', 'bg-white', 'text-blue-900');
        }

        // --- BUILD ROWS ---
        const grades = { "A1": 80, "B2": 72, "B3": 67, "C4": 62, "C5": 57, "C6": 52 };
        
        function buildInitialRows() {
            const ol = document.getElementById('olevel-container');
            ol.innerHTML = '';
            for(let i=1; i<=5; i++) {
                ol.innerHTML += `
                <div class="flex gap-2 olevel-row">
                    <input type="text" class="olevel-subj border p-3 rounded-lg w-2/3 outline-none" placeholder="Subject ${i}">
                    <select class="olevel-grade border p-3 rounded-lg w-1/3 bg-white">
                        <option value="-1">Grade</option>
                        ${Object.keys(grades).map(g => `<option value="${grades[g]}">${g}</option>`).join('')}
                    </select>
                </div>`;
            }
            for(let i=0; i<3; i++) addGPARow();
            for(let i=0; i<2; i++) addCGPARow();
        }

        function addGPARow() {
            document.getElementById('gpa-rows').innerHTML += `
            <div class="flex gap-2 gpa-row">
                <input type="text" class="border p-3 rounded-lg w-1/2 outline-none" placeholder="Course Code">
                <input type="number" class="gpa-unit border p-3 rounded-lg w-1/4 outline-none" placeholder="Units">
                <select class="gpa-grade border p-3 rounded-lg w-1/4 bg-white">
                    <option value="-1">Grade</option>
                    <option value="5">A</option><option value="4">B</option><option value="3">C</option>
                    <option value="2">D</option><option value="1">E</option><option value="0">F</option>
                </select>
            </div>`;
        }

        function addCGPARow() {
            document.getElementById('cgpa-rows').innerHTML += `
            <div class="flex gap-2 cgpa-row">
                <input type="text" class="border p-3 rounded-lg w-1/2 outline-none" placeholder="Semester">
                <input type="number" class="cgpa-tcp border p-3 rounded-lg w-1/4 outline-none" placeholder="TCP">
                <input type="number" class="cgpa-tlu border p-3 rounded-lg w-1/4 outline-none" placeholder="TLU">
            </div>`;
        }

        // --- CALCULATE AGGREGATE ---
        function calculateAggregate() {
            const jamb = parseFloat(document.getElementById('jamb-score').value) || 0;
            if (jamb < 0 || jamb > 400) { alert("JAMB score must be 0-400"); return; }
            if (jamb === 0) { alert("Please enter JAMB score"); return; }

            let sum = 0, hasGrade = false, details = [];
            document.querySelectorAll('.olevel-row').forEach((row, i) => {
                const subj = row.querySelector('.olevel-subj').value || `Subject ${i+1}`;
                const gradeVal = parseFloat(row.querySelector('.olevel-grade').value);
                const gradeTxt = row.querySelector('.olevel-grade').options[row.querySelector('.olevel-grade').selectedIndex].text;
                if (gradeVal >= 0) {
                    hasGrade = true;
                    sum += gradeVal;
                    details.push({ subj, gradeTxt, gradeVal });
                }
            });

            if (!hasGrade) { alert("Please select at least one O'Level grade"); return; }

            const jambWeight = (jamb / 400) * 75;
            const olevelWeight = (sum / 5) * 0.25;
            const total = jambWeight + olevelWeight;

            let html = `<div class="mb-2"><strong>JAMB:</strong> ${jamb}/400 (${jambWeight.toFixed(2)}%)</div>`;
            html += `<div class="mb-4"><strong>O'Level Avg:</strong> ${(sum/5).toFixed(1)} pts (${olevelWeight.toFixed(2)}%)</div>`;
            details.forEach(d => html += `<div class="text-sm text-gray-600">• ${d.subj}: ${d.gradeTxt} (${d.gradeVal} pts)</div>`);

            showModal('Admission Aggregate', total.toFixed(2) + '%', html, 'aggregate', total);
        }

        // --- CALCULATE GPA ---
        function calculateGPA() {
            let tlu = 0, tcp = 0, hasData = false, details = [];
            document.querySelectorAll('.gpa-row').forEach(row => {
                const course = row.querySelector('input[type="text"]').value || 'Course';
                const unit = parseFloat(row.querySelector('.gpa-unit').value);
                const gradeVal = parseFloat(row.querySelector('.gpa-grade').value);
                const gradeTxt = row.querySelector('.gpa-grade').options[row.querySelector('.gpa-grade').selectedIndex].text;
                
                if (unit > 0 && gradeVal >= 0) {
                    hasData = true;
                    const cp = unit * gradeVal;
                    tlu += unit;
                    tcp += cp;
                    details.push({ course, unit, gradeTxt, cp });
                }
            });

            if (!hasData) { alert("Please enter at least one course with units and grade"); return; }

            const gpa = tcp / tlu;
            let html = `<div class="mb-2"><strong>Total Units (TLU):</strong> ${tlu}</div>`;
            html += `<div class="mb-4"><strong>Total Points (TCP):</strong> ${tcp}</div>`;
            details.forEach(d => html += `<div class="text-sm text-gray-600">• ${d.course}: ${d.unit}u × ${d.gradeTxt} = ${d.cp} CP</div>`);

            showModal('Semester GPA', gpa.toFixed(2), html, 'gpa', gpa);
        }

        // --- CALCULATE CGPA ---
        function calculateCGPA() {
            let tlu = 0, tcp = 0, hasData = false, details = [];
            document.querySelectorAll('.cgpa-row').forEach(row => {
                const sem = row.querySelector('input[type="text"]').value || 'Semester';
                const cTcp = parseFloat(row.querySelector('.cgpa-tcp').value) || 0;
                const cTlu = parseFloat(row.querySelector('.cgpa-tlu').value) || 0;
                
                if (cTlu > 0 && cTcp >= 0) {
                    hasData = true;
                    tlu += cTlu;
                    tcp += cTcp;
                    details.push({ sem, cTcp, cTlu });
                }
            });

            if (!hasData) { alert("Please enter at least one semester's TCP and TLU"); return; }

            const cgpa = tcp / tlu;
            let html = `<div class="mb-2"><strong>Cumulative Units:</strong> ${tlu}</div>`;
            html += `<div class="mb-4"><strong>Cumulative Points:</strong> ${tcp}</div>`;
            details.forEach(d => html += `<div class="text-sm text-gray-600">• ${d.sem}: TCP ${d.cTcp} / TLU ${d.cTlu} (GPA ${(d.cTcp/d.cTlu).toFixed(2)})</div>`);

            showModal('Cumulative CGPA', cgpa.toFixed(2), html, 'cgpa', cgpa);
        }

        // --- SHOW MODAL ---
        function showModal(title, bigValue, breakdownHtml, type, rawResult) {
            const name = document.getElementById('student-name').value || 'Anonymous Student';
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay show';
            overlay.id = 'resultModal';
            
            overlay.innerHTML = `
                <div class="modal-content">
                    <div class="modal-head">
                        <h2 class="text-lg font-bold">${title}</h2>
                        <button onclick="document.getElementById('resultModal').remove()" class="text-white text-xl">&times;</button>
                    </div>
                    <div class="result-hero">
                        <p class="text-xs uppercase text-gray-500 font-bold tracking-widest mb-1">Your Estimate</p>
                        <p class="result-value">${bigValue}</p>
                    </div>
                    <div class="p-6">
                        <h4 class="font-bold text-gray-700 mb-4 border-b pb-2">Breakdown</h4>
                        ${breakdownHtml}
                        <div class="mt-8 flex gap-2">
                            <button onclick="downloadPDF('${name}', '${title}', '${bigValue}', \`${breakdownHtml.replace(/"/g, '&quot;')}\`)" class="flex-1 bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg shadow">Download PDF</button>
                            <button onclick="document.getElementById('resultModal').remove()" class="flex-1 bg-gray-200 hover:bg-gray-300 font-bold py-3 rounded-lg">Close</button>
                        </div>
                        <p class="text-center text-[10px] text-gray-400 mt-4">Independent student tool — estimates only.</p>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        // --- DOWNLOAD PDF ---
        function downloadPDF(name, title, value, breakdown) {
            document.getElementById('pdf-student-name').textContent = name;
            document.getElementById('pdf-dynamic-content').innerHTML = `
                <h2 style="color: #003366; font-size: 24px; margin-bottom: 20px;">${title}: ${value}</h2>
                <div>${breakdown}</div>
            `;
            const el = document.getElementById('pdf-container');
            el.style.display = 'block';
            
            html2pdf().set({
                margin: 10,
                filename: 'FUTA_Report.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(el).save().then(() => {
                el.style.display = 'none';
            });
        }

        window.onload = buildInitialRows;
    </script>
</body>
</html>
